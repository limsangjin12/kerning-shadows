<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no"
    />
    <meta name="theme-color" content="#111b28" />
    <title>Kerning Shadows</title>
  </head>
  <body>
    <main id="app" aria-label="Kerning Shadows 게임 데모">
      <div
        id="game"
        data-active-scene="boot"
        data-active-map=""
        data-assets-ready="false"
        aria-label="게임 화면"
      ></div>
      <p
        class="initial-audio-notice"
        data-testid="initial-audio-notice"
        role="status"
        aria-live="polite"
      >
        <span class="initial-audio-notice__line"
          >이 게임은 PC 환경에 최적화되어 있습니다.</span
        >
        <span class="initial-audio-notice__line"
          >BGM과 함께 플레이하려면 매너모드를 해제해주세요</span
        >
      </p>
      <div id="screen-overlay" hidden></div>
      <div id="hud-window-controls" aria-label="HUD 창 표시 설정">
        <button
          type="button"
          data-hud-panel="miniMap"
          aria-expanded="true"
          aria-label="미니맵 접기"
        >
          −
        </button>
        <button
          type="button"
          data-hud-panel="quest"
          aria-expanded="true"
          aria-label="퀘스트 알림 접기"
        >
          −
        </button>
        <button
          type="button"
          data-hud-panel="controls"
          aria-expanded="true"
          aria-label="조작 안내 접기"
        >
          −
        </button>
      </div>
      <div
        id="game-status"
        class="visually-hidden"
        role="status"
        aria-live="polite"
        aria-atomic="true"
      ></div>
    </main>
    <template id="game-menu-template">
      <section
        class="game-menu-dialog ui-panel ui-panel--metal"
        data-testid="game-menu-dialog"
        role="dialog"
        aria-modal="true"
        aria-labelledby="game-menu-title"
      >
        <header class="game-menu-header">
          <div>
            <p class="eyebrow">GAME MENU</p>
            <h2 id="game-menu-title">전체 메뉴</h2>
          </div>
          <button type="button" class="secondary" data-testid="game-menu-close">
            게임으로 돌아가기
          </button>
        </header>
        <p class="game-menu-summary"></p>
        <nav class="game-menu-grid" aria-label="게임 메뉴 항목">
          <button
            type="button"
            class="game-menu-entry"
            data-testid="menu-inventory"
          >
            <strong>인벤토리</strong><span>아이템 확인과 소모품 사용</span>
          </button>
          <button
            type="button"
            class="game-menu-entry"
            data-testid="menu-stats"
          >
            <strong>스탯 · 장비</strong><span>능력치 분배와 표창 장착</span>
          </button>
          <button
            type="button"
            class="game-menu-entry"
            data-testid="menu-skills"
          >
            <strong>스킬</strong><span>스킬 확인과 SP 분배</span>
          </button>
          <button
            type="button"
            class="game-menu-entry"
            data-testid="menu-skill-hotkeys"
          >
            <strong>스킬 단축키</strong
            ><span>숫자·Shift·QWER·ASDF·XCV 배치</span>
          </button>
          <button
            type="button"
            class="game-menu-entry"
            data-testid="menu-settings"
          >
            <strong>환경설정</strong><span>BGM · 효과음 · 음소거</span>
          </button>
        </nav>
        <p class="game-menu-help">
          ESC로 메뉴를 닫습니다 · 기존 I / S / K 단축키도 그대로 사용할 수
          있습니다.
        </p>
      </section>
    </template>
    <template id="settings-dialog-template">
      <section
        class="settings-dialog ui-panel ui-panel--metal"
        data-testid="settings-dialog"
        role="dialog"
        aria-modal="true"
        aria-labelledby="settings-dialog-title"
      >
        <p class="eyebrow">SETTINGS</p>
        <h2 id="settings-dialog-title">환경설정</h2>
        <div data-audio-settings-slot></div>
        <div class="screen-actions">
          <button type="button" class="secondary" data-testid="settings-close">
            닫기
          </button>
        </div>
      </section>
    </template>
    <template id="audio-settings-template">
      <section
        class="audio-settings-panel"
        aria-labelledby="audio-settings-title"
      >
        <strong id="audio-settings-title">사운드</strong>
        <button
          type="button"
          class="audio-mute-toggle secondary"
          data-testid="audio-mute-toggle"
        ></button>
        <label class="audio-volume-control"
          ><span>배경음</span
          ><input
            type="range"
            min="0"
            max="100"
            step="1"
            data-testid="audio-bgm-volume" /><output></output
        ></label>
        <label class="audio-volume-control"
          ><span>효과음</span
          ><input
            type="range"
            min="0"
            max="100"
            step="1"
            data-testid="audio-sfx-volume" /><output></output
        ></label>
        <small>설정은 이 브라우저에 자동 저장됩니다.</small>
      </section>
    </template>
